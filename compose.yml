# Production: 1 VPS, chạy image đã build (APP_IMAGE trong .env, tham chiếu theo digest với bản release).
#   Cài mới: deploy/install.sh (tải bundle gồm file này + .env.template).
#   Build từ source: docker compose -f compose.yml -f compose.build.yml up -d --build   (xem compose.build.yml)
# .env nằm trên VPS, nạp bằng env_file (KHÔNG bind vào container) — mẫu: .env.template
name: smm-panel

x-app: &app
  image: ${APP_IMAGE:?Đặt APP_IMAGE trong .env (vd smm-panel:local nếu tự build từ source)}
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks: [backend]
  volumes:
    - app_storage:/var/www/html/storage/app   # logo/favicon upload, tồn tại qua recreate
    - ./custom:/var/www/html/custom:ro        # view/lang/CSS tùy biến; chỉ đọc để app bị chiếm quyền không ghi được PHP vào đây

services:
  app:
    <<: *app
    environment:
      AUTORUN_ENABLED: "true"            # migrate --force, storage:link, optimize khi khởi động
      AUTORUN_LARAVEL_MIGRATION_TIMEOUT: "60"
      AUTORUN_LARAVEL_VIEW_CACHE: "false" # không biên dịch trước custom/views: view tùy biến lỗi không làm optimize/khởi động thất bại
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 20s

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 20s

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-smm_panel}
      POSTGRES_USER: ${DB_USERNAME:-smm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Đặt APP_DOMAIN trong .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.30.0.10

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24     # khớp TRUSTED_PROXIES

volumes:
  pgdata:
  app_storage:
  caddy_data:
  caddy_config:
